<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../src/output.css" />
    <title>Document</title>
  </head>
  <body class="">
    <div class="allcontainer bg-ww w-full h-full">
      <div class="TOP">
        <div class="navbar fixed bg-DG/80 backdrop-blur-xl text-WW w-full flex p-4 shadow-md">
          <div class="container mx-auto flex items-center">
            <div class="logo">
              <img src="../img/bolhuis-logo.png" alt="BolHuis Logo" />
            </div>
            
            <div id="navDropdown" class="flex items-center gap-4 ml-auto mr-4">
              <a
                href="#"
                class="nav-item px-4 py-2 text-WW hover:bg-KL/20 transition-all duration-300 rounded"
                style="opacity: 0; transform: translateX(20px);"
              >
                Home
              </a>
              <a
                href="#"
                class="nav-item px-4 py-2 text-WW hover:bg-KL/20 transition-all duration-300 rounded"
                style="opacity: 0; transform: translateX(20px);"
              >
                Products
              </a>
              <a
                href="#"
                class="nav-item px-4 py-2 text-WW hover:bg-KL/20 transition-all duration-300 rounded"
                style="opacity: 0; transform: translateX(20px);"
              >
                About Us
              </a>
              <a
                href="#"
                class="nav-item px-4 py-2 text-WW hover:bg-KL/20 transition-all duration-300 rounded"
                style="opacity: 0; transform: translateX(20px);"
              >
                Contact
              </a>
            </div>
            
            <div class="nav-menu">
              <button
                id="navToggle"
                aria-expanded="false"
                aria-controls="navDropdown"
                class="flex items-center bg-DG gap-2 p-2 rounded hover:bg-KL/20 focus:outline-none transition all ease-in-out duration-500"
              >
                Menu
              </button>
            </div>
          </div>
        </div>
        <div class="heroSection">
          <div class="">
            <img src="./img/HeroImg.JPG" alt="heroimg" />
          </div>
        </div>
      </div>
      <div class="MID"></div>
      <div class="BOT"></div>
    </div>
    <script src="../js/home.js"></script>
  </body>
</html>
