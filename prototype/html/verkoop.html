<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../src/output.css" />
    <title>Document</title>
  </head>
  <body>
    <div class="navbar fixed bg-DG/80 backdrop-blur-xl text-WW w-full flex p-4 shadow-xl z-50">
      <div class="container mx-auto flex items-center">
        <div class="logo">
          <img class="h-10 ml-10" src="./img/NavBarLogo.svg" alt="BolHuis Logo" />
        </div>

        <div id="navDropdown" class="flex items-center gap-4 ml-auto mr-10">
          <a
            href="index.html"
            class="nav-item px-4 py-2 text-WW shadow-sm hover:shadow-lg hover:shadow-KL/20 hover:bg-KL/20 hover:scale-105 transistion all ease-in-out duration-300 rounded"
            style="opacity: 0; transform: translateX(20px)"
          >
            Home
          </a>
          <a
            href="https://www.bolhuiskerstbomenplantgoed.nl/winkel/"
            class="nav-item px-4 py-2 text-WW shadow-sm hover:shadow-lg hover:shadow-KL/20 hover:bg-KL/20 hover:scale-105 transistion all ease-in-out duration-300 rounded"
            style="opacity: 0; transform: translateX(20px)"
          >
            Collectie
          </a>
          <a
            href="blog.html"
            class="nav-item px-4 py-2 text-WW shadow-sm hover:shadow-lg hover:shadow-KL/20 hover:bg-KL/20 hover:scale-105 transistion all ease-in-out duration-300 rounded"
            style="opacity: 0; transform: translateX(20px)"
          >
            Blog
          </a>
          <a
            href="overons.html"
            class="nav-item px-4 py-2 text-WW shadow-sm hover:shadow-lg hover:shadow-KL/20 hover:bg-KL/20 hover:scale-105 transistion all ease-in-out duration-300 rounded"
            style="opacity: 0; transform: translateX(20px)"
          >
            Over Ons
          </a>
          <a
            href="#top"
            class="nav-item px-4 py-2 text-WW shadow-sm hover:shadow-lg hover:shadow-KL/20 hover:bg-KL/20 hover:scale-105 transistion all ease-in-out duration-300 rounded"
            style="opacity: 0; transform: translateX(20px)"
          >
            Verkoop Plaats
          </a>
        </div>

        <div
          class="nav-menu mr-10 flex content-center shadow-sm hover:shadow-lg hover:shadow-KL/20 hover:scale-105 transistion all ease-in-out duration-300"
        >
          <button
            id="navToggle"
            aria-expanded="false"
            aria-controls="navDropdown"
            class="bg-DG gap-2 p-2 rounded hover:bg-KL/20 focus:outline-none transition all ease-in-out duration-500"
          >
            <div class="flex items-center content-center gap-1">
              <p class="">Menu</p>
              <svg
                class="w-5 h-5 transistion all ease-in-out duration-300"
                id="dropArrow"
                aria-hidden="true"
                xmlns="http://www.w3.org/2000/svg"
                width="24"
                height="24"
                fill="none"
                viewBox="0 0 24 24"
              >
                <path
                  stroke="currentColor"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="2"
                  d="m19 9-7 7-7-7"
                />
              </svg>
            </div>
          </button>
        </div>
      </div>
    </div>
    <footer class="bg-DG text-WW py-30 mt-20 relative">
      <div class="absolute inset-0 flex items-center justify-center">
        <img src="./img/trees.svg" alt="Tree" class="h-64 w-auto" />
        <img src="./img/trees.svg" alt="Tree" class="h-64 w-auto" />
      </div>
      <div class="container mx-auto px-6 relative z-10">
        <div class="flex items-center justify-center">
          <p class="text-center text-lg">&copy; 2025 Bolhuis Kwekerij. Alle rechten voorbehouden.</p>
        </div>
